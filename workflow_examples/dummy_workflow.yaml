apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dummy-example-
  labels:
    gen3username: "user-dummyuser"
    gen3teamproject: "teamproject-123"
    workflows.argoproj.io/archive-strategy: "false"
  annotations:
    workflows.argoproj.io/description: |
      This is a simple hello world example with a gen3username label,
      adapted from https://raw.githubusercontent.com/argoproj/argo-workflows/master/examples/hello-world.yaml
spec:
#=======================
# the workflow:
#=======================
  arguments:
    parameters:
    - name: test_argument
      value: test-agument-value
  entrypoint: saysomething
  templates:
  - name: saysomething
    steps:
    - - name: wait-5s
        template: wait-seconds
        arguments:
          parameters:
          - name: seconds
            value: 5
    - - name: print-hello
        template: print-message
        arguments:
          parameters:
          - name: message
            value: hello-argo-world!

#=======================
# the step definitions:
#=======================
# Use a lightweight image like `busybox` or `alpine` for basic commands like `sleep`.
  - name: wait-seconds
    inputs:
      parameters:
      - name: seconds
    container:
      image: busybox:latest
      command: [sleep]
      args: ["{{inputs.parameters.seconds}}"]

  # Use a standard image like `alpine`.
  - name: print-message
    inputs:
      parameters:
      - name: message
    container:
      image: alpine:latest
      command: [sh, -c]
      args: ["echo {{inputs.parameters.message}}"]
